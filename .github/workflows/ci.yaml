name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.lock"
      - "**.rs"
      - "**.nix"
      - "Cargo.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "**.lock"
      - "**.rs"
      - "**.nix"
      - "Cargo.toml"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  security-events: none # no SARIF uploads at workflow level; only upload-sarif job needs write

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run build
        run: |
          nix build --print-build-logs .#

  format-and-lint:
    name: Format and lint

    runs-on: ubuntu-latest
    outputs:
      sarif_uploaded: ${{ steps.set-artifact-output.outputs.sarif_uploaded }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Setup cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Run clippy check
        id: save-clippy
        continue-on-error: true
        run: |
          nix build --print-build-logs .#checks.x86_64-linux.clippy
          [ -L result ] || exit 1

      - name: Upload SARIF artifact
        if: steps.save-clippy.outcome == 'success'
        id: clippy-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: sarif-results
          path: result
          retention-days: 1

      - name: Confirm SARIF artifact upload
        id: set-artifact-output
        if: steps.clippy-artifact.outcome == 'success'
        run: |
         echo "sarif_uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Run flake checks
        run: |
          nix flake check --print-build-logs --show-trace

  upload-sarif:
    name: Upload SARIF results

    runs-on: ubuntu-latest
    needs: format-and-lint
    if: needs.format-and-lint.outputs.sarif_uploaded == 'true'

    permissions:
      security-events: write # required to upload SARIF results to GitHub code scanning

    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: sarif-results
          path: .

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          sarif_file: result

  release-gate:
    name: CI Release gate
    needs: [build, format-and-lint]

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Exit with error
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
